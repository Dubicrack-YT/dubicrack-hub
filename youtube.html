<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dubicrack — YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrap">
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="path">dubicrack@hub: ~/youtube</span>
      <span class="version" data-version>v…</span>
    </div>
    <div class="screen">
      <a class="back-link" href="index.html">← volver al hub</a>

      <p class="line"><span class="prompt">$</span> <span class="cmd">cat</span> youtube.txt<span class="cursor"></span></p>

      <div class="profile-card">
        <span class="icon-lg" data-profile-icon></span>
        <div>
          <div class="name" data-profile-name>—</div>
          <div class="handle" data-profile-handle>—</div>
        </div>
      </div>

      <a class="btn" data-profile-link href="#" target="_blank" rel="noopener noreferrer">
        Ver canal en YouTube →
      </a>

      <p class="status-line"><span class="ok">●</span> enlace externo verificado</p>
    </div>
  </div>
  <footer class="credit">Dubicrack · hub de enlaces</footer>
</div>

<script src="assets/script.js"></script>
<script>
  loadConfig()
    .then(cfg => {
      paintVersion(cfg);
      renderProfile(cfg, 'youtube');
    })
    .catch(err => console.error(err));
</script>
</body>
</html>
