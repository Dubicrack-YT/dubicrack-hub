<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="description" content="Perfil de GitHub de Dubicrack — repositorios y proyectos.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2310141c%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22monospace%22 fill=%22%23ffb000%22 text-anchor=%22middle%22%3E%26gt;_%3C/text%3E%3C/svg%3E">
<title>Dubicrack — GitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrap">
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="path">dubicrack@hub: ~/github</span>
      <span class="version" data-version>v…</span>
    </div>
    <div class="screen">
      <a class="back-link" href="../index.html">← volver al hub</a>

      <div class="profile-card">
        <span class="icon-lg" data-profile-icon></span>
        <div>
          <div class="name" data-profile-name>—</div>
          <div class="handle" data-profile-handle>—</div>
        </div>
      </div>

      <a class="btn" data-profile-link href="#" target="_blank" rel="noopener noreferrer">
        Ver perfil en GitHub →
      </a>

      <div class="repo-list" id="repo-list"></div>
      <div class="repo-viewer" id="repo-viewer" hidden></div>
    </div>
  </div>
  <footer class="credit">Dubicrack · hub de enlaces</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="../assets/script.js"></script>
<script>
  loadConfig()
    .then(cfg => {
      paintVersion(cfg);
      const site = renderProfile(cfg, 'github');
      if (site) renderGithubRepos(site.apiUser, document.getElementById('repo-list'), document.getElementById('repo-viewer'));
    })
    .catch(err => console.error(err));
</script>
</body>
</html>
