<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dubicrack — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrap">
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="path">dubicrack@hub: ~</span>
      <span class="version" data-version>v…</span>
    </div>
    <div class="screen">
      <pre class="ascii-title">D U B I C R A C K</pre>
      <p class="subtitle">// selecciona una carpeta para continuar</p>

      <p class="line"><span class="prompt">$</span> <span class="cmd">ls</span> -la<span class="cursor"></span></p>

      <div class="listing" id="listing">
        <!-- se genera desde config.json -->
      </div>

      <p class="footer-line"><span class="prompt">$</span> _</p>
    </div>
  </div>
  <footer class="credit">Dubicrack · hub de enlaces</footer>
</div>

<script src="assets/script.js"></script>
<script>
  loadConfig()
    .then(cfg => {
      paintVersion(cfg);
      renderListing(cfg, document.getElementById('listing'));
    })
    .catch(err => {
      document.getElementById('listing').innerHTML =
        '<p style="padding:16px;color:var(--text-dim);font-size:12px;">Error cargando config.json: ' + err.message + '</p>';
    });
</script>
</body>
</html>
