<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="description" content="Canal de YouTube de Dubicrack — videos, metas del canal y contacto.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2310141c%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22monospace%22 fill=%22%23ffb000%22 text-anchor=%22middle%22%3E%26gt;_%3C/text%3E%3C/svg%3E">
<title>Dubicrack — YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrap">
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="path">dubicrack@hub: ~/youtube</span>
      <span class="version" data-version>v…</span>
    </div>
    <div class="screen">
      <a class="back-link" href="../index.html">← volver al hub</a>

      <div class="profile-card">
        <span class="icon-lg" data-profile-icon></span>
        <div>
          <div class="name" data-profile-name>—</div>
          <div class="handle" data-profile-handle>—</div>
        </div>
      </div>

      <p class="bio-text" data-bio>Cargando…</p>
      <p class="contact-line" data-contact></p>

      <div class="video-embed" data-video-main></div>
      <div class="carousel-wrap" data-car-arrows>
        <button class="carousel-arrow" data-car-prev aria-label="Anterior">‹</button>
        <div class="video-carousel" data-video-strip></div>
        <button class="carousel-arrow" data-car-next aria-label="Siguiente">›</button>
      </div>

      <a class="btn" data-profile-link href="#" target="_blank" rel="noopener noreferrer">
        Ver canal en YouTube →
      </a>

      <div class="goals" data-goals></div>
    </div>
  </div>
  <footer class="credit">Dubicrack · hub de enlaces</footer>
</div>

<script src="../assets/script.js"></script>
<script>
  loadConfig()
    .then(cfg => {
      paintVersion(cfg);
      const site = renderProfile(cfg, 'youtube');
      if (site) renderYoutubeExtras(site);
    })
    .catch(err => console.error(err));
</script>
</body>
</html>
